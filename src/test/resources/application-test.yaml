# 테스트 프로파일: H2 인메모리 DB, PostgreSQL 호환, 스키마 자동 생성, 로그 설정
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

# 통합 테스트 시 BinaryContentStorage 빈 생성용 (LocalBinaryContentStorage)
discodeit:
  storage:
    type: local
    local:
      root-path: ./build/tmp/test-binary-storage

# 디버깅용 로그 레벨
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.Binder: TRACE
    org.hibernate.orm.jdbc.bind: TRACE
    com.sprint.mission.discodeit.repository: DEBUG
