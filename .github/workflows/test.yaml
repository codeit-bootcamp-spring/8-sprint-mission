# 테스트용 워크 플로우명
name: Discodeit-Jun-Test AWS

# 언제 실행할 것인가
on:
  push:
    # 내 포크 저장소의 sprint- 로 시작하는 모든 브랜치에 push하면 즉시 실행
    branches: [ "sprint-*" ]
  pull_request:
    # Upstream의 '최준영' 브랜치로 PR을 날릴 때 한 번 더 실행
    branches: [ "최준영" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 테스트를 위한 임시 .env 파일 생성
      - name: Create .env file for testing
        run: |
          echo "AWS_S3_ACCESS_KEY=${{ secrets.AWS_S3_ACCESS_KEY }}" >> .env
          echo "AWS_S3_SECRET_KEY=${{ secrets.AWS_S3_SECRET_KEY }}" >> .env
          echo "AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}" >> .env
          echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> .env

      # 테스트 실행
      - name: Test with Gradle
        run: ./gradlew test

      # CodeCov에 결과 업로드
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}