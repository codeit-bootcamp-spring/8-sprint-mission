spring:
  application:
    name: discodeit

  # Admin 서버 연결 설정 (이 부분이 정확해야 대시보드에 뜹니다)
  boot:
    admin:
      client:
        url: http://localhost:9090
        instance:
          prefer-ip: true # IP(39.117.32.46)를 자동으로 감지해서 등록합니다

  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 30MB

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit?currentSchema=discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: discodeit
        format_sql: true
        use_sql_comments: true

# 3. BinaryContent 저장소 설정
discodeit:
  storage:
    type: local
    local:
      root-path: ./storage/binary-contents

# 4. SQL 로그 상세 설정
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace

# 5. Actuator 엔드포인트 설정 (Admin 서버가 데이터를 가져가는 통로)
management:
  endpoints:
    web:
      exposure:
        include: "*" # 모든 정보를 노출해서 Admin 서버가 잘 보이게 합니다
  endpoint:
    health:
      show-details: always
    info:
      enabled: true

# 6. Actuator /info 노출 정보
info:
  app:
    name: Discodeit
    version: 1.7.0
    java-version: "17"
    spring-boot-version: 3.5.9 # 실제 실행 중인 버전으로 수정