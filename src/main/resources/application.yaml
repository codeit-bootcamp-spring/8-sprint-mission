spring:
  datasource:
    # PostgreSQL 연결 정보
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 실제 DB 테이블과 엔티티를 비교하여 검증만 합니다. (직접 DDL을 실행했으므로 validate 권장)
      ddl-auto: validate
    properties:
      hibernate:
        # PostgreSQL 문법에 맞게 SQL을 생성합니다.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # SQL을 보기 좋게 정렬합니다. (디버깅용)
        format_sql: true
        # 주석을 통해 어떤 쿼리인지 설명합니다. (디버깅용)
        use_sql_comments: true

# 3. SQL 로그 상세 설정
logging:
  level:
    # 실행되는 SQL 쿼리를 콘솔에 출력합니다.
    org.hibernate.SQL: debug
    # 쿼리에 들어가는 파라미터 값(? 자리에 들어갈 값)을 출력합니다.
    org.hibernate.orm.jdbc.bind: trace