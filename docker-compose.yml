version: '3.8'

services:
  # 1. Reverse Proxy (Nginx)
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx-proxy
    ports:
      - "3000:80" # Client -> localhost:3000
    networks:
      - external-network
      - internal-network
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: discodeit:local
    deploy:
      replicas: 3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      broker:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - SERVER_PORT=${SERVER_PORT:-8080}

      # Database
      - SPRING_DATASOURCE_URL=${POSTGRES_URL:-jdbc:postgresql://db:5432}/${POSTGRES_DB:-discodeit}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

      # Redis
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT}

      # Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID}

      # JWT (추가된 부분)
      - JWT_ACCESS_TOKEN=${JWT_ACCESS_TOKEN}
      - JWT_REFRESH_TOKEN=${JWT_REFRESH_TOKEN}

      # Admin (추가된 부분)
      - DISCODEIT_ADMIN_USERNAME=${DISCODEIT_ADMIN_USERNAME}
      - DISCODEIT_ADMIN_PASSWORD=${DISCODEIT_ADMIN_PASSWORD}
      - DISCODEIT_ADMIN_EMAIL=${DISCODEIT_ADMIN_EMAIL}

      # Storage
      - STORAGE_TYPE=${STORAGE_TYPE}
      - DISCODEIT_STORAGE_LOCAL_ROOT_PATH=/app/data/uploadfiles

      # JVM & TZ
      - JVM_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC
      - TZ=Asia/Seoul

      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    volumes:
      - app_logs:/app/logs
      - app_data:/app/data/uploadfiles
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:${SERVER_PORT:-8080}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - internal-network # 외부망 차단

  db:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-discodeit}
      - POSTGRES_USER=${POSTGRES_USER:-discodeit_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-discodeit1234}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
      - TZ=Asia/Seoul
    networks:
      - internal-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Memory DB (Redis)
  redis:
    image: redis:7.2-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - internal-network
    volumes:
      - redis_data:/data

  # Message Broker (kafka)
  broker:
    image: apache/kafka:latest
    container_name: kafka-broker
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@broker:29093
      - KAFKA_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:29093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://broker:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - internal-network

networks:
  external-network:
    driver: bridge
  internal-network:
    driver: bridge
    internal: true # 외부와 완전히 단절된 내부망

volumes:
  postgres_data:
    name: discodeit-postgres-data
  app_logs:
    name: discodeit-app-logs
  app_data:
    name: discodeit-app-data
  redis_data:
    name: discodeit-redis-data