spring:
  application:
    name: discodeit

  cache:
    type: caffeine
    cache-names:
      - userList
      - channelsByUserId
      - notificationsByUserId
    caffeine:
      spec: >
        maximumSize=100,
        expireAfterAccess=600s,
        recordStats

  servlet:
    multipart:
      max-file-size: 10MB       # 파일 1개 최대
      max-request-size: 20MB    # 요청 전체(여러 파일 합) 최대
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit?currentSchema=discodeit_schema
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: discodeit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: discodeit_schema

logging:
  level:
    root: info

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        # 외부로 노출할 엔드포인트 지정
        include: health,info, caches
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  observations:
    annotations:
      enabled: true

# 애플리케이션 및 주요 설정 정보
info:
  app:
    name: Discodeit
    version: 1.7.0
    java: 17
    spring-boot: 3.5.8

  # 주요 설정 정보
  config:
    datasource:
      url: ${spring.datasource.url:unknown}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto:unknown}
    storage:
      type: ${discodeit.storage.type:unknown}
      path: ${discodeit.storage.local.root-path:unknown}
    multipart:
      max-file-size: ${spring.servlet.multipart.max-file-size:unknown}
      max-request-size: ${spring.servlet.multipart.max-request-size:unknown}

discodeit:
  storage:
    type: ${STORAGE_TYPE:local} # s3로 설정 시 S3 모드 활성화
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION:unknown}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}
    local:
      root-path: C:\myWs\uploadedFiles

  security:
    remember-me:
      key: ${REMEMBER_ME_KEY:discodeit-secret-key}
    jwt:
      # 환경 변수명 DISCODEIT_JWT_SECRET을 참조하고, 없을 경우 기본값 OR 비워둔다.
      secret: ${DISCODEIT_JWT_SECRET}
      # 액세스 토큰 유효 기간 (예: 1시간 = 3600000ms)
      access-token-validity: 3600000
      # 리프레시 토큰 유효 기간 (예: 7일 = 604800000ms)
      refresh-token-validity: 604800000
