plugins {
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
}

group = 'com.sprint.mission'
version = '1.2-M8'

// 2. Repositories 블록은 최상위 레벨에 위치해야 합니다.
repositories {
    mavenCentral()
}

// 3. Java 설정 블록
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// 4. Dependencies 블록은 최상위 레벨에 위치해야 합니다.
dependencies {
    // Spring Boot Dependency
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // PostgreSQL JDBC Driver
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok Dependency
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Spring Boot Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // SpringDoc OpenAPI (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // AWS S3 SDK 추가
    implementation 'software.amazon.awssdk:s3:2.30.0'

}

// 5. Test 블록
test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// Jacoco - Codecov용 커버리지 리포트
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

// 6. Jar 파일명 설정 (Dockerfile의 PROJECT_NAME과 일치)
bootJar {
    archiveBaseName = 'discodeit'
}