spring:
  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량
  datasource:
    # PostgreSQL 연결 정보
    url: jdbc:postgresql://localhost:5432/discodeit?currentSchema=discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 엔티티를 기반으로 테이블을 자동 생성/업데이트합니다.
      ddl-auto: update
    properties:
      hibernate:
        # PostgreSQL 문법에 맞게 SQL을 생성합니다.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # 기본 스키마 설정
        default_schema: discodeit
        # SQL을 보기 좋게 정렬합니다. (디버깅용)
        format_sql: true
        # 주석을 통해 어떤 쿼리인지 설명합니다. (디버깅용)
        use_sql_comments: true

# 3. BinaryContent 저장소 설정
discodeit:
  storage:
    type: local  # local, s3 등 저장소 타입
    local:
      root-path: ./storage/binary-contents  # 로컬 디스크 저장 경로

# 4. SQL 로그 상세 설정
logging:
  level:
    # 실행되는 SQL 쿼리를 콘솔에 출력합니다.
    org.hibernate.SQL: debug
    # 쿼리에 들어가는 파라미터 값(? 자리에 들어갈 값)을 출력합니다.
    org.hibernate.orm.jdbc.bind: trace

# 5. Actuator 엔드포인트 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
    metrics:
      enabled: true
    loggers:
      enabled: true

# 6. Actuator /info 노출 정보 (애플리케이션 정보)
info:
  app:
    name: Discodeit
    version: 1.7.0
    java-version: "17"
    spring-boot-version: 3.4.0
  datasource:
    url: ${spring.datasource.url:unknown}
    driver-class-name: ${spring.datasource.driver-class-name:unknown}
  jpa:
    ddl-auto: ${spring.jpa.hibernate.ddl-auto:unknown}
  storage:
    type: ${discodeit.storage.type:local}
    path: ${discodeit.storage.local.root-path:unknown}
  multipart:
    max-file-size: ${spring.servlet.multipart.maxFileSize:unknown}
    max-request-size: ${spring.servlet.multipart.maxRequestSize:unknown}