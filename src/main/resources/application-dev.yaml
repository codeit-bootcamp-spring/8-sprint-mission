server:
  port: 8080

spring:
  config:
    import: optional:file:discodeit.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/discodeit}
    username: ${SPRING_DATASOURCE_USERNAME:discodeit_user}
    password: ${SPRING_DATASOURCE_PASSWORD:discodeit1234}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    properties:
      hibernate:
        format_sql: true

discodeit:
  admin:
    username: ${DISCODEIT_ADMIN_USERNAME:admin}
    email: ${DISCODEIT_ADMIN_EMAIL:admin@discodeit.local}
    password: ${DISCODEIT_ADMIN_PASSWORD:admin1234}

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace

management:
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
