# 배포 아키텍처: Nginx(3000) → Backend x3(replicas) + PostgreSQL / Redis / Kafka (외부 포트 없음)
# 다이어그램의 Backend-1~3: Compose deploy.replicas:3으로 동일 스펙 태스크 3개 (DNS: backend → Task IP들)
services:
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        # round_robin | least_conn | ip_hash | weight — 변경 후: docker compose build nginx && docker compose up -d
        NGINX_LB_STRATEGY: round_robin
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      mode: replicated
      replicas: 3
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-discodeit}?currentSchema=discodeit
      DB_USERNAME: ${POSTGRES_USER:-discodeit_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-discodeit1234}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SPRING_BOOT_ADMIN_CLIENT_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:-default-secret-key-that-is-at-least-32-bytes-long!123}
      DISCODEIT_STORAGE_LOCAL_ROOT_PATH: /app/storage/binary-contents
      JVM_OPTS: ${JVM_OPTS:-}
    volumes:
      - binary-contents-data:/app/storage/binary-contents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      broker:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discodeit}
      POSTGRES_USER: ${POSTGRES_USER:-discodeit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discodeit1234}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discodeit_user} -d ${POSTGRES_DB:-discodeit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  broker:
    image: apache/kafka:latest
    hostname: broker
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  binary-contents-data:
