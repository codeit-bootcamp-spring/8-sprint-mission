server:
  port: 8080

spring:
  application:
    name: discodeit

  # 로컬에서 Redis를 띄우지 않을 때 로그인/캐시 무효화가 실패하지 않도록 인메모리 캐시 사용
  cache:
    type: simple

  boot:
    admin:
      client:
        url: http://localhost:9090

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  # 로컬에 Kafka(9092)가 없을 때 소비자 재연결 WARN이 반복되지 않도록 리스너 비활성화
  kafka:
    listener:
      auto-startup: false

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace

discodeit:
  setup:
    default-password: password
    admin:
      username: admin
      email: admin@discodeit.com
      password: Admin123!