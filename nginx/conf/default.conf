    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'upstream_addr=$upstream_addr '
                        'upstream_response_time=$upstream_response_time '
                        'request_time=$request_time';

    access_log /dev/stdout detailed;
    error_log /dev/stderr info;

    #Least Connections
    #least_conn;

    #Ip Hash
    #ip_hash;

    #Weight
    #server backend-1:8000 weight=3;
    #server backend-2:8000 weight=2;
    #server backend-2:8000 weight=1;

    #기본 값: Round-Robin
    upstream backend-server {
        server backend:8080;

        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    server {
        listen 80;
        server_name localhost;

        location /api/sse {
            proxy_pass http://backend-server;

            # 프록시 헤더 설정
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE 필수 설정
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;

            # 타임아웃을 웹소켓과 동일하게 길게 설정
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            add_header X-Upstream-Server $upstream_addr always;
        }

        location /api/ {
            proxy_pass http://backend-server;

            # 프록시 헤더 설정
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 3000;

            # upstream keepalive가 작동하기 위한 필수 헤더
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 타임아웃 방어 설정
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # SSE 등의 실시간 스트리밍을 위한 버퍼링 해제
            proxy_buffering off;

            # 로드밸런싱 확인용 헤더 (어느 서버가 처리했는지 응답 헤더에 표시한다.)
            add_header X-Upstream-Server $upstream_addr always;
        }

        location /ws/ {
            proxy_pass http://backend-server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;

            # 웹소켓 연결 시 어느 서버에서 작동하는지 확인하는 헤더
            add_header X-Upstream-Server $upstream_addr always;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }