server:
  port: 8080

spring:
  application:
    name: discodeit

  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none

  cache:
    type: redis
    cache-names:
      - channel
      - notification
      - user
    redis:
      enable-statistics: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:broker:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: discodeit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

async:
  executors:
    core-size: ${ASYNC_CORE_SIZE:2}
    max-size: ${ASYNC_MAX_SIZE:4}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}
    keep-alive-second: ${ASYNC_KEEP_ALIVE:60}

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
  email: ${ADMIN_EMAIL}

jwt:
  access-token:
    secret: ${JWT_ACCESS_TOKEN}
    exp: 900000        # 15분(ms)
  refresh-token:
    secret: ${JWT_REFRESH_TOKEN}
    exp: 3600000       # 1시간(ms)
  max-active-count: 1

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (기본값: 10분)

logging:
  level:
    com.sprint.mission.discodeit: info

# Spring Boot Actuator 설정 추가
management:
  endpoints:
    web:
      exposure:
        include: "*"
  observations:
    annotations:
      enabled: true

  info:
    env:
      enabled: true

# Spring Boot Actuator info 추가
info:
  app:
    name: Discodeit
    version: 1.7.0
    java:
      version: 17
    spring-boot-version: "3.5.9"

  config:
    datasource:
      url: "${spring.datasource.url}"
      driver-class-name: "${spring.datasource.driver-class-name}"
    jpa:
      ddl-auto: "${spring.jpa.hibernate.ddl-auto}"
    storage:
      type: "${discodeit.storage.type}"
      path: "${discodeit.storage.local.root-path}"
    multipart:
      max-file-size: "${spring.servlet.multipart.max-file-size}"
      max-request-size: "${spring.servlet.multipart.max-request-size}"